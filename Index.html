<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUILHERME-TCH | Biblioteca PDF</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root { --primary: #2563eb; --accent: #d946ef; --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; }
        .dark-mode { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); transition: 0.3s; padding-bottom: 50px; }

        header { background: #1e293b; padding: 1rem 5%; color: white; display: flex; justify-content: space-between; align-items: center; }
        
        .admin-panel { background: var(--card); margin: 20px 5%; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .input-group { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        
        input[type="text"], select { padding: 10px; border: 1px solid #ddd; border-radius: 8px; flex: 1; }
        input[type="file"] { font-size: 0.8rem; }

        .btn-add { background: #059669; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        .container { padding: 20px 5%; }
        .grid-livros { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        
        .card-livro { background: var(--card); padding: 20px; border-radius: 15px; text-align: center; border: 1px solid rgba(0,0,0,0.05); }
        .capa { height: 120px; width: 90px; margin: 0 auto 15px; border-radius: 5px; display: flex; align-items: center; justify-content: center; color: white; font-size: 2.5rem; box-shadow: 3px 3px 8px rgba(0,0,0,0.2); }

        .btn-open { background: var(--primary); color: white; text-decoration: none; padding: 8px; border-radius: 5px; display: block; margin-top: 10px; font-size: 0.9rem; font-weight: bold; }
        .btn-del { background: none; border: none; color: #ff4444; cursor: pointer; margin-top: 10px; font-size: 0.8rem; text-decoration: underline; }
    </style>
</head>
<body>

<header>
    <div class="logo"><b>GUILHERME-TCH</b> | Biblioteca Digital</div>
    <button onclick="document.body.classList.toggle('dark-mode')" style="cursor:pointer; padding:5px">Tema</button>
</header>

<section class="admin-panel">
    <h2 style="margin-bottom:10px">Adicionar Livro PDF</h2>
    <div class="input-group">
        <input type="text" id="titulo" placeholder="Nome da Matéria">
        <input type="file" id="arquivo-pdf" accept="application/pdf">
        <input type="color" id="cor" value="#2563eb">
        <button class="btn-add" onclick="adicionarLivro()">Adicionar Livro</button>
    </div>
</section>

<div class="container">
    <div class="grid-livros" id="estante"></div>
</div>

<script>
    let biblioteca = [];

    function adicionarLivro() {
        const titulo = document.getElementById('titulo').value;
        const arquivo = document.getElementById('arquivo-pdf').files[0];
        const cor = document.getElementById('cor').value;

        if (!titulo || !arquivo) {
            alert("Por favor, preencha o nome e selecione um arquivo PDF!");
            return;
        }

        // Cria uma URL temporária para o arquivo PDF selecionado
        const urlArquivo = URL.createObjectURL(arquivo);

        const novoLivro = {
            titulo: titulo,
            cor: cor,
            pdf: urlArquivo
        };

        biblioteca.push(novoLivro);
        atualizarEstante();
        
        // Limpar campos
        document.getElementById('titulo').value = '';
        document.getElementById('arquivo-pdf').value = '';
    }

    function atualizarEstante() {
        const estante = document.getElementById('estante');
        estante.innerHTML = '';

        biblioteca.forEach((livro, index) => {
            estante.innerHTML += `
                <div class="card-livro">
                    <div class="capa" style="background: ${livro.cor}">
                        <i class="fas fa-file-pdf"></i>
                    </div>
                    <h3>${livro.titulo}</h3>
                    <a href="${livro.pdf}" target="_blank" class="btn-open">LER LIVRO PDF</a>
                    <button class="btn-del" onclick="remover(${index})">Remover</button>
                </div>
            `;
        });
    }

    function remover(index) {
        biblioteca.splice(index, 1);
        atualizarEstante();
    }
</script>

</body>
</html>
