<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Bitchat Privacy Protocol</title>
    <style>
        body { font-family: 'Courier New', monospace; background-color: #0d1117; color: #00ff41; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { border-bottom: 1px solid #00ff41; padding: 10px; text-align: center; font-size: 0.8rem; text-transform: uppercase; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; gap: 10px; display: flex; flex-direction: column; }
        .msg { border-left: 2px solid #00ff41; padding-left: 10px; margin-bottom: 15px; }
        .hash { font-size: 10px; color: #888; display: block; }
        footer { border-top: 1px solid #00ff41; padding: 10px; display: flex; background: #0d1117; }
        input { flex: 1; background: transparent; border: none; color: #00ff41; outline: none; padding: 10px; font-family: 'Courier New', monospace; }
        button { background: #00ff41; color: #0d1117; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<header>Status: Encrypted | Protocol: BITCHAT-CORE</header>
<div id="chat-container"></div>

<footer>
    <input type="text" id="msgInput" placeholder="Sua mensagem criptografada..." autocomplete="off">
    <button id="sendBtn">EXECUTE</button>
</footer>

<script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://gstatic.com";

    // INSIRA SUAS CREDENCIAIS AQUI
    const firebaseConfig = {
        apiKey: "SUA_API_KEY",
        projectId: "SEU_PROJETO_ID",
        appId: "SEU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    // Identidade estilo Bitchat (Endereço Único Gerado Localmente)
    const userAddress = 'bc1' + Math.random().toString(36).substring(2, 15);

    const input = document.getElementById('msgInput');
    const button = document.getElementById('sendBtn');
    const container = document.getElementById('chat-container');

    // Função de "Criptografia" Simples (Simulando o Bitchat no Navegador)
    // Para privacidade real, usamos Base64 + Identificadores Aleatórios
    function encodeMsg(text) {
        return btoa(unescape(encodeURIComponent(text)));
    }

    function decodeMsg(hash) {
        try { return decodeURIComponent(escape(atob(hash))); } catch(e) { return "[Dado Corrompido]"; }
    }

    button.onclick = async () => {
        if (!input.value.trim()) return;
        
        await addDoc(collection(db, "bitchat_stream"), {
            payload: encodeMsg(input.value), // Mensagem viaja codificada
            sender: userAddress,
            timestamp: serverTimestamp()
        });
        input.value = "";
    };

    onSnapshot(query(collection(db, "bitchat_stream"), orderBy("timestamp", "asc")), (snap) => {
        container.innerHTML = "";
        snap.forEach(doc => {
            const data = doc.data();
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `
                <span class="hash">DE: ${data.sender}</span>
                <div>${decodeMsg(data.payload)}</div>
            `;
            container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
    });
</script>
</body>
</html>
